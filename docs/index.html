<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DrumBlender Demo</title>
    <meta
      name="description"
      content="Paper demo for DrumBlender reconstruction, audition, metrics, and controllability examples."
    />
    <link rel="stylesheet" href="./assets/site.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar" aria-label="Demo header">
        <div>
          <p class="eyebrow">DrumBlender</p>
          <h1>Differentiable Percussive Audio Modeling</h1>
        </div>
        <nav class="tabs" aria-label="Demo sections">
          <button class="tab is-active" type="button" data-view="audition">Audition</button>
          <button class="tab" type="button" data-view="control">Control</button>
          <button class="tab" type="button" data-view="metrics">Metrics</button>
        </nav>
      </header>

      <main>
        <section class="scoreboard" aria-label="Experiment summary">
          <article>
            <span class="stat-label">Run</span>
            <strong id="summary-run">Loading</strong>
          </article>
          <article>
            <span class="stat-label">Samples</span>
            <strong id="summary-items">-</strong>
          </article>
          <article>
            <span class="stat-label">MSS Loss</span>
            <strong id="summary-loss">-</strong>
          </article>
          <article>
            <span class="stat-label">LSD</span>
            <strong id="summary-lsd">-</strong>
          </article>
          <article>
            <span class="stat-label">Onset Flux</span>
            <strong id="summary-flux">-</strong>
          </article>
        </section>

        <section id="view-audition" class="view is-active" aria-labelledby="audition-title">
          <div class="view-head">
            <div>
              <p class="eyebrow">Audition Visualizer</p>
              <h2 id="audition-title">Target vs. Reconstruction</h2>
            </div>
            <div class="toolbar">
              <label>
                <span>Bundle</span>
                <select id="audition-run"></select>
              </label>
              <label>
                <span>Search</span>
                <input id="audition-search" type="search" placeholder="kick, snare, MDLib2..." />
              </label>
            </div>
          </div>
          <div id="bucket-filter" class="segmented" aria-label="Sample quality filter"></div>
          <div id="audition-grid" class="audition-grid"></div>
        </section>

        <section id="view-control" class="view" aria-labelledby="control-title">
          <div class="view-head">
            <div>
              <p class="eyebrow">Controllability</p>
              <h2 id="control-title">Latent Control Sweep</h2>
            </div>
            <div class="toolbar">
              <label>
                <span>Demo</span>
                <select id="control-demo"></select>
              </label>
            </div>
          </div>
          <div id="control-panel" class="control-panel"></div>
        </section>

        <section id="view-metrics" class="view" aria-labelledby="metrics-title">
          <div class="view-head">
            <div>
              <p class="eyebrow">Evaluation</p>
              <h2 id="metrics-title">Pack-Level Metrics</h2>
            </div>
            <p id="generated-meta" class="generated-meta"></p>
          </div>
          <div class="metric-layout">
            <div id="pack-ranking" class="ranking"></div>
            <div class="table-wrap">
              <table id="metric-table">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./assets/site.js"></script>
  </body>
</html>
